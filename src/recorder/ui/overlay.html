<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vista</title>
    <link rel="stylesheet" href="../../web/public/tokens.css" />
    <style>
      /* Always-on overlay. Tokens from tokens.css (DESIGN.md); panel is a floating
         surface so it may carry a shadow, unlike cards. */
      :root {
        --glass: rgba(251, 248, 242, 0.96);
        --orb: var(--rust);
        --orb-hover: #9c3c18;
        --glow: color-mix(in srgb, var(--rust) 35%, transparent);
        --glow-strong: color-mix(in srgb, var(--rust) 55%, transparent);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; overflow: hidden; height: 100%; }
      body {
        font-family: var(--font-sans);
        color: var(--ink);
        font-size: 13px; line-height: 18px;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        padding: 6px;
      }
      #shell {
        background: var(--glass);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-md);
        overflow: hidden;
        transform-origin: 50% 26px;
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.22s ease;
        will-change: transform, opacity;
      }
      /* ---------------- pill row ---------------- */
      #pill {
        height: 50px;
        display: grid;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        gap: var(--space-2);
        padding: 0 var(--space-2) 0 var(--space-3);
        -webkit-app-region: drag;
      }
      #pill button, #panel button { -webkit-app-region: no-drag; }
      .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--line-strong); justify-self: center;
        transition: background 0.2s;
      }
      .recording .dot { background: var(--danger); animation: pulse 1.4s ease-in-out infinite; }
      .paused .dot { background: var(--warning); }
      .finishing .dot { background: var(--moss); animation: pulse 0.6s ease-in-out infinite; }
      .private .dot { background: var(--warning); animation: none; }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 var(--danger-soft); }
        50% { box-shadow: 0 0 0 6px transparent; }
      }
      #meta { min-width: 0; line-height: 16px; }
      #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #sub { color: var(--ink-muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
      #actions { display: flex; gap: var(--space-1); align-items: center; }
      button {
        appearance: none; border: 1px solid transparent; cursor: pointer;
        font: inherit; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink);
        background: var(--surface-sunken);
        border-radius: var(--radius-pill); height: var(--control-md); padding: 0 var(--space-3);
        display: inline-flex; align-items: center; gap: var(--space-1);
        transition: background 0.18s ease, transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.18s;
      }
      button:hover { background: var(--surface-selected); }
      button:active { transform: scale(0.97); }
      button.primary { background: var(--brand); color: var(--on-brand); font-weight: 600; padding: 0 var(--space-4); }
      button.primary:hover { background: var(--brand-hover); }
      button.stop { background: var(--danger-soft); color: var(--danger); }
      button.stop:hover { background: var(--danger); color: var(--on-danger); }
      button.pause { background: var(--warning-soft); color: var(--warning); }
      button.pause:hover { background: var(--warning-soft); }
      button.icon { width: var(--control-md); padding: 0; justify-content: center; color: var(--ink-muted); background: transparent; }
      button.icon:hover { color: var(--ink); background: var(--surface-hover); }
      button svg { width: 14px; height: 14px; fill: currentColor; }
      .hidden { display: none !important; }

      /* ---------------- expanded panel ---------------- */
      #panel { border-top: 1px solid var(--line); padding: var(--space-3) var(--space-3) var(--space-4); display: grid; gap: var(--space-3); }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
      .label { color: var(--ink-muted); font-size: 11px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
      .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-2); }
      .stat b { display: block; font-family: var(--font-display); font-size: 18px; line-height: 20px; font-weight: 400; font-variant-numeric: tabular-nums; }
      .stat span { color: var(--ink-muted); font-size: 11px; line-height: 16px; }
      #apps { display: grid; gap: 5px; }
      .app { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2); font-size: 12px; line-height: 16px; align-items: center; }
      .app span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-muted); }
      .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--surface-sunken); overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--ink); }
      #feed { display: grid; gap: 4px; max-height: 64px; overflow: hidden; font-size: 11px; line-height: 16px; color: var(--ink-muted); }
      #feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #feed b { color: var(--ink); font-weight: 500; }
      .privacy { font-size: 11px; line-height: 16px; color: var(--ink-muted); display: flex; gap: var(--space-1); align-items: center; }
      .privacy i { width: 6px; height: 6px; border-radius: 50%; background: var(--moss); display: inline-block; }
      .privacy.on i { background: var(--warning); }
      .links { display: flex; gap: var(--space-3); }
      .links a { color: var(--ink-secondary); text-decoration: none; font-size: 12px; line-height: 16px; cursor: pointer; }
      .links a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rust); }

      /* ---------------- intent card (right after Start) ---------------- */
      #intent { border-top: 1px solid var(--line); padding: var(--space-3) var(--space-3) var(--space-4); display: grid; gap: var(--space-2); }
      #intent .q { font-family: var(--font-display); font-size: 15px; line-height: 20px; }
      #intent .hint { color: var(--ink-muted); font-size: 11px; line-height: 16px; }
      #intent textarea {
        -webkit-app-region: no-drag; resize: none; width: 100%; font: inherit; color: var(--ink);
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
        padding: var(--space-2) var(--space-3); min-height: 58px; outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }
      #intent textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
      #intent .act { display: flex; gap: var(--space-2); align-items: center; justify-content: flex-end; }
      #intent .act a { margin-right: auto; color: var(--ink-secondary); font-size: 12px; cursor: pointer; -webkit-app-region: no-drag; }
      #intent .act a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
      body.intent #intent { display: grid; }
      body:not(.intent) #intent { display: none; }

      /* ---------------- idle orb ---------------- */
      /* Orb and shell both stay in the DOM; the mode switch cross-fades them so
         hovering feels like the circle unfolds into the pill instead of snapping. */
      #orb {
        position: absolute; top: 50%; left: 50%; margin: -26px 0 0 -26px;
        width: 52px; height: 52px; border-radius: 50%;
        background: var(--orb);
        box-shadow: 0 6px 22px var(--glow);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease, background 0.2s ease;
        will-change: transform, opacity;
      }
      #orb:hover { transform: scale(1.08); background: var(--orb-hover); }
      #orb svg { width: 28px; height: 28px; transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); position: relative; z-index: 1; overflow: visible; }
      #orb:hover svg { transform: scale(1.1); }

      /* Face: two eyes + a mouth drawn in cream. The mood class on the svg picks the
         mouth path and eye shape; both ease between moods, and the eyes blink now and then. */
      .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s ease-in-out infinite; }
      .eye { fill: var(--on-brand); transform-box: fill-box; transform-origin: center; transition: transform 0.35s ease; }
      .mouth { fill: none; stroke: var(--on-brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: d 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      /* every mouth is the same M-Q-Q shape so the browser can interpolate the path */
      .m-happy .mouth     { d: path('M 9 18 Q 14 23 19 18 Q 14 23 9 18'); }
      .m-content .mouth   { d: path('M 10 18.5 Q 14 20.5 18 18.5 Q 14 20.5 10 18.5'); }
      .m-wink .mouth      { d: path('M 9 18 Q 14 23 19 18 Q 14 23 9 18'); }
      .m-wink .eye.r      { transform: scaleY(0.12); }
      .m-surprised .mouth { d: path('M 12 18.5 Q 14 15.5 16 18.5 Q 14 21.5 12 18.5'); }
      .m-surprised .eye   { transform: scale(1.3); }
      .m-sleepy .mouth    { d: path('M 12.5 19 Q 14 20 15.5 19 Q 14 20 12.5 19'); }
      .m-sleepy .eye      { transform: scaleY(0.3); }
      .m-cheeky .mouth    { d: path('M 10 19 Q 13 22.5 18.5 16.5 Q 13 22.5 10 19'); }
      .m-cheeky .eye.l    { transform: scale(1.15); }

      /* The only idle motion: a slow, faint breath of the glow, so the orb reads as ready. */
      body.orb #orb { animation: breathe 5s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { box-shadow: 0 6px 22px var(--glow); }
        50% { box-shadow: 0 6px 28px var(--glow-strong); }
      }

      body.orb #shell { opacity: 0; transform: scaleX(0.16) scaleY(0.8); pointer-events: none; }
      body:not(.orb) #orb { opacity: 0; transform: scale(0.5); pointer-events: none; }
      body.orb #orb { opacity: 1; transform: scale(1); }
      body.orb #orb:hover { transform: scale(1.08); }
      body:not(.orb) #shell { opacity: 1; transform: none; }
      body.settling #shell, body.settling #orb { transition-duration: 0.18s; }
      @media (prefers-reduced-motion: reduce) { #shell, #orb, #orb svg, .eye, .mouth, button { transition: none !important; } #orb, .eyes { animation: none !important; } }
    </style>
  </head>
  <body class="orb">
    <div id="orb" title="Vista — hover to start recording">
      <svg id="face" class="m-happy" viewBox="0 0 28 28">
        <g class="eyes">
          <circle class="eye l" cx="9.5" cy="11" r="1.9"/>
          <circle class="eye r" cx="18.5" cy="11" r="1.9"/>
        </g>
        <path class="mouth" d="M 9 18 Q 14 23 19 18 Q 14 23 9 18"/>
      </svg>
    </div>
    <div id="shell" class="idle">
      <div id="pill">
        <div class="dot"></div>
        <div id="meta">
          <div id="title">Vista is off</div>
          <div id="sub">Click Start when you begin working</div>
        </div>
        <div id="actions">
          <button id="start" class="primary">Start recording</button>
          <button id="pause" class="pause hidden" title="Pause recording">
            <svg viewBox="0 0 16 16"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>
            Pause
          </button>
          <button id="resume" class="primary hidden">Resume</button>
          <button id="stop" class="stop hidden" title="Stop and save">
            <svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>
            Stop
          </button>
          <button id="expand" class="icon" title="Details">
            <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div id="intent">
        <div class="q">What are you working on today?</div>
        <textarea id="intent-text" rows="2" maxlength="4000" placeholder="e.g. Month-end close — reconciling AP invoices in Excel and QuickBooks"></textarea>
        <div class="act">
          <a id="intent-skip">Skip for now</a>
          <span class="hint">Enter to save</span>
          <button id="intent-save" class="primary">Let's go</button>
        </div>
      </div>
      <div id="panel" class="hidden">
        <div class="row"><span class="label">This session</span><span id="elapsed" class="label">00:00</span></div>
        <div class="stats">
          <div class="stat"><b id="s-click">0</b><span>clicks</span></div>
          <div class="stat"><b id="s-key">0</b><span>keys</span></div>
          <div class="stat"><b id="s-shortcut">0</b><span>shortcuts</span></div>
          <div class="stat"><b id="s-screen">0</b><span>screens</span></div>
        </div>
        <div>
          <div class="label" style="margin-bottom:6px">Where your time went</div>
          <div id="apps"></div>
        </div>
        <div id="feed"></div>
        <div class="row">
          <div id="privacy" class="privacy"><i></i><span id="privacy-text">Redacting emails, phones, cards on this device</span></div>
        </div>
        <div class="links">
          <a id="open-dash">Open my dashboard</a>
          <a id="collapse">Hide details</a>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const shell = $('shell');
      let expanded = false;
      let status = null;
      let hoverTimer = null;

      // Idle → a single rust orb. Hovering it unfolds the pill with the Start button;
      // leaving (still idle, not expanded) folds it back. Recording keeps the pill.
      // Growing: resize the window first, then animate the content in. Shrinking:
      // animate out first, then resize, so the window never clips mid-animation.
      const MODE_SIZE = { orb: 0, pill: 1, intent: 2, panel: 3 };
      let mode = 'orb', shrinkTimer = null;
      function setMode(next) {
        if (next === mode) return;
        clearTimeout(shrinkTimer);
        const growing = MODE_SIZE[next] > MODE_SIZE[mode];
        mode = next;
        if (growing) {
          window.vista.resizeOverlay(next).then(() => requestAnimationFrame(() => document.body.classList.toggle('orb', next === 'orb')));
        } else {
          document.body.classList.toggle('orb', next === 'orb');
          shrinkTimer = setTimeout(() => window.vista.resizeOverlay(next), next === 'orb' ? 230 : 0);
        }
      }

      // While the orb is idle its face drifts through moods (mostly happy/content, an
      // occasional wink or yawn). The face is only visible in orb mode, so no reset is needed.
      const MOODS = ['happy', 'content', 'wink', 'happy', 'surprised', 'content', 'cheeky', 'sleepy'];
      let moodIdx = 0;
      setInterval(() => {
        if (mode !== 'orb') return;
        moodIdx = (moodIdx + 1) % MOODS.length;
        $('face').setAttribute('class', `m-${MOODS[moodIdx]}`);
      }, 6000);

      // mousemove too: mouseenter doesn't fire when the cursor is already over the orb as the window appears
      $('orb').onmouseenter = $('orb').onmousemove = () => { clearTimeout(hoverTimer); setMode('pill'); };
      document.body.onmouseleave = () => {
        if (!status || status.state !== 'idle' || expanded) return;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => { if (status && status.state === 'idle' && !expanded) setMode('orb'); }, 450);
      };
      document.body.onmouseenter = () => clearTimeout(hoverTimer);

      const fmt = (ms) => {
        const s = Math.floor(ms / 1000);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
        return (h ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      };
      const short = (app) => app.replace(/^Microsoft /, '').replace(/ Desktop$/, '');

      function render(st) {
        const wasIdle = !status || status.state === 'idle';
        status = st;
        if (st.state === 'idle' && intentOpen) closeIntent(false, { resize: false });
        if (st.state !== 'idle' && mode === 'orb') setMode(expanded ? 'panel' : 'pill');
        if (st.state === 'idle' && !wasIdle && !expanded) setMode('orb');
        shell.className = st.state + (st.current.private ? ' private' : '');
        const rec = st.state === 'recording', paused = st.state === 'paused', fin = st.state === 'finishing';
        $('start').classList.toggle('hidden', st.state !== 'idle');
        $('pause').classList.toggle('hidden', !rec);
        $('resume').classList.toggle('hidden', !paused);
        $('stop').classList.toggle('hidden', !(rec || paused));
        if (st.state === 'idle') {
          $('title').textContent = 'Vista is off';
          $('sub').textContent = st.counts.total ? `Last session saved · ${st.counts.total.toLocaleString()} interactions` : 'Click Start when you begin working';
        } else if (fin) {
          $('title').textContent = 'Saving your session…';
          $('sub').textContent = 'Finishing screen capture and writing files';
        } else if (paused) {
          $('title').textContent = 'Paused — nothing is being recorded';
          $('sub').textContent = `${fmt(st.elapsedMs)} recorded so far`;
        } else if (st.current.private) {
          $('title').textContent = 'Private app — capture muted';
          $('sub').textContent = `${short(st.current.app)} is on your private list`;
        } else {
          $('title').textContent = st.current.app ? `Recording · ${short(st.current.app)}` : 'Recording';
          $('sub').textContent = `${fmt(st.elapsedMs)} · ${st.current.title || 'waiting for a window'}`;
        }
        // panel
        $('elapsed').textContent = fmt(st.elapsedMs);
        for (const k of ['click', 'key', 'shortcut', 'screen']) $('s-' + k).textContent = (st.counts[k] ?? 0).toLocaleString();
        const total = st.apps.reduce((a, b) => a + b.seconds, 0) || 1;
        $('apps').innerHTML = st.apps.slice(0, 4).map((a) =>
          `<div class="app"><span>${esc(short(a.app))}</span><span>${Math.round((a.seconds / total) * 100)}%</span>
           <div class="bar"><i style="width:${(a.seconds / total) * 100}%"></i></div></div>`).join('') || '<div class="app" style="color:var(--ink-muted)">No activity yet</div>';
        $('feed').innerHTML = st.log.slice(-4).reverse().map((l) =>
          `<div><b>${esc(l.type)}</b> ${esc(l.label)}</div>`).join('');
        const priv = $('privacy');
        priv.classList.toggle('on', !!st.current.private);
        $('privacy-text').textContent = st.current.private
          ? 'Private app open — no clicks, keys or screens saved'
          : `Redacted on this device: ${st.counts.redactions} item${st.counts.redactions === 1 ? '' : 's'}`;
      }
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      function setExpanded(v) {
        expanded = v;
        $('panel').classList.toggle('hidden', !v);
        $('expand').style.transform = v ? 'rotate(180deg)' : '';
        if (intentOpen) closeIntent(false);
        else setMode(v ? 'panel' : 'pill');
      }

      // Right after Start the pill opens into the intent card; saving or skipping
      // returns it to the recording pill.
      let intentOpen = false;
      function openIntent() {
        intentOpen = true;
        $('intent-text').value = '';
        expanded = false;
        $('panel').classList.add('hidden');
        $('expand').style.transform = '';
        document.body.classList.add('intent');
        setMode('intent');
        setTimeout(() => $('intent-text').focus(), 320);
      }
      function closeIntent(save, { resize = true } = {}) {
        if (!intentOpen) return;
        intentOpen = false;
        const text = $('intent-text').value.trim();
        if (save && text) window.vista.setIntent(text).then(render);
        document.body.classList.remove('intent');
        if (resize) setMode(expanded ? 'panel' : 'pill');
      }
      $('intent-save').onclick = () => closeIntent(true);
      $('intent-skip').onclick = () => closeIntent(false);
      $('intent-text').onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); closeIntent(true); }
        if (e.key === 'Escape') closeIntent(false);
      };

      $('start').onclick = () => window.vista.start().then((st) => { render(st); if (st.state === 'recording') openIntent(); });
      $('pause').onclick = () => window.vista.pause().then(render);
      $('resume').onclick = () => window.vista.resume().then(render);
      $('stop').onclick = () => window.vista.stop().then(render);
      $('expand').onclick = () => setExpanded(!expanded);
      $('collapse').onclick = () => setExpanded(false);
      $('open-dash').onclick = () => window.vista.openDashboard();

      window.vista.onStatus(render);
      // Stop folds the window to the orb from the main process; drop the expanded
      // panel with it so the next open is not clipped.
      window.vista.onOverlayCollapse?.(() => {
        if (intentOpen) closeIntent(false, { resize: false });
        expanded = false;
        $('panel').classList.add('hidden');
        $('expand').style.transform = '';
        mode = 'orb';
        document.body.classList.add('orb');
      });
      window.vista.status().then(render);
      setInterval(() => { if (status && status.state !== 'idle') window.vista.status().then(render); }, 1000);
    </script>
  </body>
</html>
