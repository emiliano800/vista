<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vista</title>
    <style>
      :root {
        --glass: rgba(18, 18, 21, 0.86);
        --line: rgba(255, 255, 255, 0.08);
        --fg: #f5f5f2;
        --muted: rgba(245, 245, 242, 0.55);
        --accent: #3d63dd;
        --rec: #ff4d4f;
        --ok: #34c77b;
        --warn: #f5b942;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; overflow: hidden; height: 100%; }
      body {
        font-family: 'Instrument Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
        color: var(--fg);
        font-size: 13px;
        -webkit-user-select: none;
        user-select: none;
        padding: 6px;
      }
      #shell {
        background: var(--glass);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        overflow: hidden;
        transform-origin: 50% 26px;
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.22s ease;
        will-change: transform, opacity;
      }
      /* ---------------- pill row ---------------- */
      #pill {
        height: 50px;
        display: grid;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 0 10px 0 14px;
        -webkit-app-region: drag;
      }
      #pill button, #panel button { -webkit-app-region: no-drag; }
      .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--muted); justify-self: center;
        transition: background 0.2s;
      }
      .recording .dot { background: var(--rec); animation: pulse 1.4s ease-in-out infinite; }
      .paused .dot { background: var(--warn); }
      .finishing .dot { background: var(--accent); animation: pulse 0.6s ease-in-out infinite; }
      .private .dot { background: var(--warn); animation: none; }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 79, 0.55); }
        50% { box-shadow: 0 0 0 7px rgba(255, 77, 79, 0); }
      }
      #meta { min-width: 0; line-height: 1.2; }
      #title { font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
      #actions { display: flex; gap: 6px; align-items: center; }
      button {
        appearance: none; border: 0; cursor: pointer;
        font: inherit; color: var(--fg);
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px; height: 32px; padding: 0 12px;
        display: inline-flex; align-items: center; gap: 6px;
        transition: background 0.18s ease, transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.18s;
      }
      button:hover { transform: translateY(-1px); }
      button:hover { background: rgba(255, 255, 255, 0.14); }
      button:active { transform: scale(0.97); }
      button.primary { background: var(--accent); font-weight: 600; padding: 0 16px; }
      button.primary:hover { background: #4d71e6; }
      button.stop { background: rgba(255, 77, 79, 0.18); color: #ffb3b4; }
      button.stop:hover { background: rgba(255, 77, 79, 0.3); }
      button.pause { background: rgba(245, 185, 66, 0.16); color: #ffd98a; }
      button.pause:hover { background: rgba(245, 185, 66, 0.28); }
      button.icon { width: 32px; padding: 0; justify-content: center; color: var(--muted); }
      button.icon:hover { color: var(--fg); }
      button svg { width: 14px; height: 14px; fill: currentColor; }
      .hidden { display: none !important; }

      /* ---------------- expanded panel ---------------- */
      #panel { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 12px; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .stat { background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 8px 10px; }
      .stat b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .stat span { color: var(--muted); font-size: 11px; }
      #apps { display: grid; gap: 5px; }
      .app { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 12px; align-items: center; }
      .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--accent); }
      #feed { display: grid; gap: 4px; max-height: 64px; overflow: hidden; font-size: 11.5px; color: var(--muted); }
      #feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #feed b { color: var(--fg); font-weight: 500; }
      .privacy { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
      .privacy i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; }
      .privacy.on i { background: var(--warn); }
      .links { display: flex; gap: 12px; }
      .links a { color: var(--muted); text-decoration: none; font-size: 12px; cursor: pointer; }
      .links a:hover { color: var(--fg); }

      /* ---------------- idle orb ---------------- */
      /* Orb and shell both stay in the DOM; the mode switch cross-fades them so
         hovering feels like the circle unfolds into the pill instead of snapping. */
      #orb {
        position: absolute; top: 50%; left: 50%; margin: -26px 0 0 -26px;
        width: 52px; height: 52px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #6d8cf0, var(--accent) 60%, #2b48b0);
        box-shadow: 0 6px 22px rgba(61, 99, 221, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
        will-change: transform, opacity;
      }
      #orb:hover { transform: scale(1.08); }
      #orb svg { width: 20px; height: 20px; fill: #fff; transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); position: relative; z-index: 1; }
      #orb:hover svg { transform: scale(1.15); }

      /* Idle animations. The orb cycles through these (one class at a time,
         see ORB_ANIMS below) so it reads as alive without being distracting.
         ::before / ::after are the extra shapes (rings, orbiting dot, sheen). */
      #orb::before, #orb::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0; }

      #orb.a-breathe { animation: breathe 3.2s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { box-shadow: 0 6px 22px rgba(61, 99, 221, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
        50% { box-shadow: 0 6px 30px rgba(61, 99, 221, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.25); transform: scale(1.04); }
      }

      #orb.a-ripple::before, #orb.a-ripple::after { border: 2px solid rgba(109, 140, 240, 0.9); animation: ripple 2.4s cubic-bezier(0.2, 0.7, 0.3, 1) infinite; }
      #orb.a-ripple::after { animation-delay: 1.2s; }
      @keyframes ripple {
        0% { transform: scale(0.9); opacity: 0.8; }
        100% { transform: scale(1.35); opacity: 0; }
      }

      #orb.a-orbit::before { inset: -6px; border: 1.5px solid rgba(109, 140, 240, 0.35); opacity: 1; }
      #orb.a-orbit::after {
        inset: -6px; opacity: 1; border-radius: 50%;
        background: radial-gradient(circle 4px at 50% 0%, #fff 0, #fff 55%, transparent 60%);
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.9));
        animation: orbit 2.6s linear infinite;
      }
      @keyframes orbit { to { transform: rotate(360deg); } }

      #orb.a-shimmer { background: radial-gradient(circle at 35% 30%, #6d8cf0, var(--accent) 60%, #2b48b0); overflow: hidden; }
      #orb.a-shimmer::before {
        opacity: 1; inset: -20%;
        background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.55) 50%, transparent 60%);
        animation: shimmer 2.8s ease-in-out infinite;
      }
      @keyframes shimmer {
        0%, 35% { transform: translateX(-70%); }
        65%, 100% { transform: translateX(70%); }
      }

      #orb.a-float { animation: floaty 3.6s ease-in-out infinite; }
      @keyframes floaty {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        30% { transform: translateY(-4px) rotate(-3deg); }
        70% { transform: translateY(2px) rotate(3deg); }
      }

      #orb.a-hue { animation: hue 4s ease-in-out infinite; }
      @keyframes hue {
        0%, 100% { filter: hue-rotate(0deg) saturate(1); }
        50% { filter: hue-rotate(-28deg) saturate(1.25); box-shadow: 0 6px 28px rgba(80, 140, 240, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
      }

      body.orb #shell { opacity: 0; transform: scaleX(0.16) scaleY(0.8); pointer-events: none; }
      body:not(.orb) #orb { opacity: 0; transform: scale(0.5); pointer-events: none; }
      body.orb #orb { opacity: 1; transform: scale(1); }
      body.orb #orb:hover { transform: scale(1.08); }
      body:not(.orb) #shell { opacity: 1; transform: none; }
      body.settling #shell, body.settling #orb { transition-duration: 0.18s; }
      @media (prefers-reduced-motion: reduce) { #shell, #orb, #orb svg, button { transition: none !important; } #orb, #orb::before, #orb::after { animation: none !important; } }
    </style>
  </head>
  <body class="orb">
    <div id="orb" title="Vista — hover to start recording">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5"/></svg>
    </div>
    <div id="shell" class="idle">
      <div id="pill">
        <div class="dot"></div>
        <div id="meta">
          <div id="title">Vista is off</div>
          <div id="sub">Click Start when you begin working</div>
        </div>
        <div id="actions">
          <button id="start" class="primary">Start recording</button>
          <button id="pause" class="pause hidden" title="Pause recording">
            <svg viewBox="0 0 16 16"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>
            Pause
          </button>
          <button id="resume" class="primary hidden">Resume</button>
          <button id="stop" class="stop hidden" title="Stop and save">
            <svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>
            Stop
          </button>
          <button id="expand" class="icon" title="Details">
            <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div id="panel" class="hidden">
        <div class="row"><span class="label">This session</span><span id="elapsed" class="label">00:00</span></div>
        <div class="stats">
          <div class="stat"><b id="s-click">0</b><span>clicks</span></div>
          <div class="stat"><b id="s-key">0</b><span>keys</span></div>
          <div class="stat"><b id="s-shortcut">0</b><span>shortcuts</span></div>
          <div class="stat"><b id="s-screen">0</b><span>screens</span></div>
        </div>
        <div>
          <div class="label" style="margin-bottom:6px">Where your time went</div>
          <div id="apps"></div>
        </div>
        <div id="feed"></div>
        <div class="row">
          <div id="privacy" class="privacy"><i></i><span id="privacy-text">Redacting emails, phones, cards on this device</span></div>
        </div>
        <div class="links">
          <a id="open-dash">Open my dashboard</a>
          <a id="collapse">Hide details</a>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const shell = $('shell');
      let expanded = false;
      let status = null;
      let hoverTimer = null;

      // Idle → a single blue orb. Hovering it unfolds the pill with the Start button;
      // leaving (still idle, not expanded) folds it back. Recording keeps the pill.
      // Growing: resize the window first, then animate the content in. Shrinking:
      // animate out first, then resize, so the window never clips mid-animation.
      let mode = 'orb', shrinkTimer = null;
      function setMode(next) {
        if (next === mode) return;
        clearTimeout(shrinkTimer);
        const growing = next !== 'orb' && (mode === 'orb' || next === 'panel');
        mode = next;
        applyOrbAnim();
        if (growing) {
          window.vista.resizeOverlay(next).then(() => requestAnimationFrame(() => document.body.classList.toggle('orb', next === 'orb')));
        } else {
          document.body.classList.toggle('orb', next === 'orb');
          shrinkTimer = setTimeout(() => window.vista.resizeOverlay(next), next === 'orb' ? 230 : 0);
        }
      }
      // Idle orb cycles through its animations, one at a time, a few loops each.
      const ORB_ANIMS = ['breathe', 'ripple', 'orbit', 'shimmer', 'float', 'hue'];
      const ORB_ANIM_MS = 7000;
      let animIdx = 0;
      function applyOrbAnim() {
        const orb = $('orb');
        orb.classList.remove(...ORB_ANIMS.map((a) => `a-${a}`));
        if (mode === 'orb') orb.classList.add(`a-${ORB_ANIMS[animIdx]}`);
      }
      applyOrbAnim();
      setInterval(() => { animIdx = (animIdx + 1) % ORB_ANIMS.length; applyOrbAnim(); }, ORB_ANIM_MS);

      // mousemove too: mouseenter doesn't fire when the cursor is already over the orb as the window appears
      $('orb').onmouseenter = $('orb').onmousemove = () => { clearTimeout(hoverTimer); setMode('pill'); };
      document.body.onmouseleave = () => {
        if (!status || status.state !== 'idle' || expanded) return;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => { if (status && status.state === 'idle' && !expanded) setMode('orb'); }, 450);
      };
      document.body.onmouseenter = () => clearTimeout(hoverTimer);

      const fmt = (ms) => {
        const s = Math.floor(ms / 1000);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
        return (h ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      };
      const short = (app) => app.replace(/^Microsoft /, '').replace(/ Desktop$/, '');

      function render(st) {
        const wasIdle = !status || status.state === 'idle';
        status = st;
        if (st.state !== 'idle' && document.body.classList.contains('orb')) setMode(expanded ? 'panel' : 'pill');
        if (st.state === 'idle' && !wasIdle && !expanded) setMode('orb');
        shell.className = st.state + (st.current.private ? ' private' : '');
        const rec = st.state === 'recording', paused = st.state === 'paused', fin = st.state === 'finishing';
        $('start').classList.toggle('hidden', st.state !== 'idle');
        $('pause').classList.toggle('hidden', !rec);
        $('resume').classList.toggle('hidden', !paused);
        $('stop').classList.toggle('hidden', !(rec || paused));
        if (st.state === 'idle') {
          $('title').textContent = 'Vista is off';
          $('sub').textContent = st.counts.total ? `Last session saved · ${st.counts.total.toLocaleString()} interactions` : 'Click Start when you begin working';
        } else if (fin) {
          $('title').textContent = 'Saving your session…';
          $('sub').textContent = 'Finishing screen capture and writing files';
        } else if (paused) {
          $('title').textContent = 'Paused — nothing is being recorded';
          $('sub').textContent = `${fmt(st.elapsedMs)} recorded so far`;
        } else if (st.current.private) {
          $('title').textContent = 'Private app — capture muted';
          $('sub').textContent = `${short(st.current.app)} is on your private list`;
        } else {
          $('title').textContent = st.current.app ? `Recording · ${short(st.current.app)}` : 'Recording';
          $('sub').textContent = `${fmt(st.elapsedMs)} · ${st.current.title || 'waiting for a window'}`;
        }
        // panel
        $('elapsed').textContent = fmt(st.elapsedMs);
        for (const k of ['click', 'key', 'shortcut', 'screen']) $('s-' + k).textContent = (st.counts[k] ?? 0).toLocaleString();
        const total = st.apps.reduce((a, b) => a + b.seconds, 0) || 1;
        $('apps').innerHTML = st.apps.slice(0, 4).map((a) =>
          `<div class="app"><span>${esc(short(a.app))}</span><span>${Math.round((a.seconds / total) * 100)}%</span>
           <div class="bar"><i style="width:${(a.seconds / total) * 100}%"></i></div></div>`).join('') || '<div class="app" style="color:var(--muted)">No activity yet</div>';
        $('feed').innerHTML = st.log.slice(-4).reverse().map((l) =>
          `<div><b>${esc(l.type)}</b> ${esc(l.label)}</div>`).join('');
        const priv = $('privacy');
        priv.classList.toggle('on', !!st.current.private);
        $('privacy-text').textContent = st.current.private
          ? 'Private app open — no clicks, keys or screens saved'
          : `Redacted on this device: ${st.counts.redactions} item${st.counts.redactions === 1 ? '' : 's'}`;
      }
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      function setExpanded(v) {
        expanded = v;
        $('panel').classList.toggle('hidden', !v);
        $('expand').style.transform = v ? 'rotate(180deg)' : '';
        setMode(v ? 'panel' : 'pill');
      }

      $('start').onclick = () => window.vista.start().then(render);
      $('pause').onclick = () => window.vista.pause().then(render);
      $('resume').onclick = () => window.vista.resume().then(render);
      $('stop').onclick = () => window.vista.stop().then(render);
      $('expand').onclick = () => setExpanded(!expanded);
      $('collapse').onclick = () => setExpanded(false);
      $('open-dash').onclick = () => window.vista.openDashboard();

      window.vista.onStatus(render);
      window.vista.status().then(render);
      setInterval(() => { if (status && status.state !== 'idle') window.vista.status().then(render); }, 1000);
    </script>
  </body>
</html>
