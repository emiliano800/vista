services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vista
      POSTGRES_PASSWORD: vista
      POSTGRES_DB: vista
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vista"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vista
      MINIO_ROOT_PASSWORD: vista-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
