[project]
name = "vista"
version = "0.1.0"
description = "Process intelligence for lower-middle-market companies: desktop recorder, task-mining engine, backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "boto3>=1.34",
    "pydantic-settings>=2.4",
    "email-validator>=2.0",
    "openai>=3.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
taskmining = "taskmining.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vista", "src/taskmining"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
include = [
    "src/taskmining/**/*.py", "tests/test_pipeline.py", "tests/test_web.py",
    "src/vista/security.py", "src/vista/recordings.py", "src/vista/auth.py",
    "src/vista/main.py", "src/vista/manage.py", "src/vista/api/recordings.py",
    "src/vista/api/sessions.py", "migrations/platform/versions/0002_browser_sessions.py",
    "migrations/tenant/versions/0003_recordings.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency/query declarations are intentionally evaluated in signatures.
"src/vista/api/*.py" = ["B008"]
"src/vista/auth.py" = ["B008"]
