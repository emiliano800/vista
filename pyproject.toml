[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-taskmining"
version = "0.1.0"
description = "Open reimplementation of the Celonis Task Mining pipeline: desktop event capture -> event log -> process discovery -> automation scoring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
taskmining = "taskmining.__main__:main"

[tool.setuptools.packages.find]
include = ["taskmining*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
