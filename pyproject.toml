[project]
name = "vista"
version = "0.1.0"
description = "Backend for an AI-agent platform serving lower-middle-market PE firms"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "boto3>=1.34",
    "pydantic-settings>=2.4",
    "email-validator>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vista"]

[tool.pytest.ini_options]
testpaths = ["tests"]
