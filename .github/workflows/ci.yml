name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  taskmining:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest ruff
      - run: ruff check . && ruff format --check .
      - run: pytest -q tests/test_pipeline.py
      - run: python -m taskmining run --synthetic 20 --annotations auto --out out/
