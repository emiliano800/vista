name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  taskmining:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q tests/test_pipeline.py
      - run: uv run python -m taskmining run --synthetic 20 --annotations auto --out out/

  recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in src/main.js src/recorder.js src/demo.js src/preload.cjs; do node --check "$f"; done
        working-directory: src/recorder
      - run: node --test test/*.test.js
        working-directory: src/recorder
