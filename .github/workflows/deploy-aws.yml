name: Deploy AWS API

# Redeploys the ECS API (deploy/aws/deploy.sh) whenever main changes.
# Credentials come from repository secrets: either AWS_DEPLOY_ROLE_ARN (OIDC role) or
# AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY. Optional repository variables:
# AWS_REGION (default us-east-1), STACK_NAME (default vista), WORKER_DESIRED_COUNT (default 0).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "src/web/**"
      - "src/recorder/**"
  workflow_dispatch:
    inputs:
      no_build:
        description: "Redeploy the stack with the last pushed image (skip docker build)"
        type: boolean
        default: false

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: ${{ vars.STACK_NAME || 'vista' }}
      WORKER_DESIRED_COUNT: ${{ vars.WORKER_DESIRED_COUNT || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - run: aws sts get-caller-identity
      - run: deploy/aws/deploy.sh ${{ inputs.no_build && '--no-build' || '' }}
      - name: Wait for the service to settle and check health
        run: |
          CLUSTER=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" --output text)
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$STACK_NAME-api"
          ENDPOINT=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          case $ENDPOINT in https://*) ;; *) ENDPOINT="https://${ENDPOINT#http://}" ;; esac
          curl -fsS "${ENDPOINT%/}/api/health"
