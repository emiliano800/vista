# Two migration environments:
#   alembic -n platform upgrade head            -> shared `platform` schema
#   alembic -n tenant -x schema=t_xxx upgrade head -> one tenant schema
# Tenant migrations for ALL tenants are applied via vista.tenancy.migrate_all_tenants().

[platform]
script_location = migrations/platform

[tenant]
script_location = migrations/tenant

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
